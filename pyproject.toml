[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-ccd-mcp"
version = "0.1.0"
description = "Local-network MCP control for HDSLM and ToupCam experimental devices"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "numpy>=1.26,<3", "Pillow>=10,<13", "pydantic>=2.12,<3", "starlette>=0.48,<1", "uvicorn>=0.31,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
lab-mcp = "lab_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
